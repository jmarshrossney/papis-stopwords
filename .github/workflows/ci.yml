name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      # `dev` includes rust-just, so `just` is available via `uv run just`.
      - run: uv sync --group dev --locked
      - run: uv run just lint-check
      - run: uv run just typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --locked
      - run: uv run just test-cov

  # The plugin subclasses papis private API, so every supported papis release
  # is exercised explicitly rather than relying on the lockfile's resolution.
  papis-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        papis-version: ["0.15.0", "0.16.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --group dev --locked
      - run: uv run just test-papis ${{ matrix.papis-version }}
