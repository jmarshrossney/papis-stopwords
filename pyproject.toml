[build-system]
requires = ["uv_build>=0.11.17,<0.13.0"]
build-backend = "uv_build"

[project]
name = "papis-stopwords"
version = "0.1.0"
description = "A simple plugin for papis that removes stop-words from citation keys that include (parts of) the title"
authors = [
    { name = "Joe Marsh Rossney", email = "17361029+jmarshrossney@users.noreply.github.com" }
]
readme = "README.md"
# GPL-3.0-or-later to match papis, which this plugin imports and subclasses.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# papis itself requires >=3.10, and this plugin only ever runs inside a papis
# environment, so it matches that floor rather than setting a higher one.
requires-python = ">=3.10"
# Upper bound because the plugin subclasses papis private API; raise it only
# after running `just test-papis <version>` against the new release.
dependencies = ["papis>=0.15,<0.17"]
keywords = ["papis", "bibliography", "bibtex", "citation", "formatter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/jmarshrossney/papis-stopwords"
Issues = "https://github.com/jmarshrossney/papis-stopwords/issues"

[project.entry-points."papis.format"]
stopwords = "papis_stopwords:StopwordFormatter"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "ruff>=0.16.1",
    "rust-just>=1.57.0",
    {include-group = "test"},
]
test = [
    "coverage>=7.15.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src/", "tests/"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
# Ruff broadened its default rule set in 0.16, so always select explicitly:
# that way a version bump cannot change which rules apply.
select = [
    "E",   # pycodestyle errors
    "D",   # pydocstyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "PT",  # flake8-pytest-style
    "I",   # isort
]

[tool.ruff.lint.per-file-ignores]
# Exempt tests from docstring requirements.
"tests/**" = ["D", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
# Resolve against the index as it was a week ago, so a same-day release cannot
# break a fresh `uv sync`. Note the corollary: a lower bound in
# [dependency-groups] must be at or below the version that existed a week ago,
# or resolution fails outright.
exclude-newer = "1 week"
